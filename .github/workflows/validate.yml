name: Validate MCAT
on:
  push:
    branches: [main]
  pull_request:
permissions:
  contents: read
jobs:
  validate:
    strategy:
      matrix:
        os: [ubuntu-latest, windows-latest]
    runs-on: ${{ matrix.os }}
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@d23441a48e516b6c34aea4fa41551a30e30af803
        with:
          persist-credentials: false
      - uses: actions/setup-node@249970729cb0ef3589644e2896645e5dc5ba9c38
        with:
          node-version: '22'
      - name: Final-two regression
        run: node tools/test-final-two.cjs
      - name: Resilience fuzzing of synced data
        run: node tools/test-fuzz.cjs
      - name: Planner property tests
        run: node tools/test-plan-properties.cjs
      - name: Strict CSP and delegated UI actions
        run: node tools/test-actions.cjs
      - name: Daily plan pacing (TODAY checklist)
        run: node tools/test-daily-plan.cjs
      - name: Subject progression regression
        run: node tools/test-study-path.cjs
      - name: Security and reliability regression
        run: node tools/test-audit.cjs
      - name: Editorial quality and progress compatibility
        run: node tools/test-editorial.cjs
      - name: Personalized guidance and incorrect-only review
        run: node tools/test-learning-guide.cjs
      - name: Delayed retention and official benchmarks
        run: node tools/test-learning-evidence.cjs
      - name: Linked page navigation regression
        run: node tools/test-pages.cjs
      - name: Visible study timer regression
        run: node tools/test-study-timer.cjs
      - name: Sign-in SDK load error messages
        run: node tools/test-sdk-load.cjs
      - name: Worked methods (How to work it out)
        run: node tools/test-worked-methods.cjs
      - name: Cloud account isolation and sync regression
        run: node tools/test-account.cjs
      - name: Content validation
        run: node tools/check-content.cjs
      - name: Custom-domain deployment isolation
        run: node tools/test-deployment.cjs
      - name: Parse development server
        shell: pwsh
        run: |
          $parseErrors = $null
          $parseTokens = $null
          [System.Management.Automation.Language.Parser]::ParseFile((Join-Path $PWD 'tools/serve.ps1'), [ref]$parseTokens, [ref]$parseErrors) | Out-Null
          if ($parseErrors.Count) { throw ($parseErrors | Out-String) }
      - name: Chrome browser smoke
        if: runner.os == 'Linux'
        run: node tools/test-browser.cjs
