name: Validate MCAT
on:
  push:
    branches: [main]
  pull_request:
permissions:
  contents: read
jobs:
  validate:
    strategy:
      matrix:
        os: [ubuntu-latest, windows-latest]
    runs-on: ${{ matrix.os }}
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262
        with:
          persist-credentials: false
      - uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020
        with:
          node-version: '22'
      - name: Final-two regression
        run: node tools/test-final-two.cjs
      - name: Subject progression regression
        run: node tools/test-study-path.cjs
      - name: Security and reliability regression
        run: node tools/test-audit.cjs
      - name: Content validation
        run: node tools/check-content.cjs
      - name: Parse development server
        shell: pwsh
        run: |
          $parseErrors = $null
          $parseTokens = $null
          [System.Management.Automation.Language.Parser]::ParseFile((Join-Path $PWD 'tools/serve.ps1'), [ref]$parseTokens, [ref]$parseErrors) | Out-Null
          if ($parseErrors.Count) { throw ($parseErrors | Out-String) }
      - name: Chrome browser smoke
        if: runner.os == 'Linux'
        run: node tools/test-browser.cjs
